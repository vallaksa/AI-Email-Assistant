spring:
  application:
    name: Email-Assistant

  # Logging Configuration
  logging:
    level: DEBUG


# Server Configuration
server:
  port: 8080


# Gmail Configuration (All from Environment Variables)
gmail:
  account:
    email: ${GMAIL_EMAIL}
  oauth2:
    client-id: ${GMAIL_CLIENT_ID}
    client-secret: ${GMAIL_CLIENT_SECRET}
    scopes:
      - https://www.googleapis.com/auth/gmail.send
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/gmail.modify
  imap:
    host: imap.gmail.com
    port: 993
    username: ${GMAIL_EMAIL}
    auth-mechanism: XOAUTH2
    ssl: true
  smtp:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_EMAIL}
    auth-mechanism: XOAUTH2
    starttls: true
    ssl-trust: smtp.gmail.com

# AI Configuration (All from Environment Variables)
ai:
  api:
    url: ${AI_API_URL}
    key: ${AI_API_KEY:}
    auth-header: ${AI_AUTH_HEADER:}
    auth-prefix: ${AI_AUTH_PREFIX:}
    content-type: ${AI_CONTENT_TYPE:application/json}
  model:
    name: ${AI_MODEL_NAME:}
  timeouts:
    connect-ms: ${AI_CONNECT_TIMEOUT:10000}
    read-ms: ${AI_READ_TIMEOUT:60000}


# Application-specific Configuration
application:
  email-fetch:
    max-emails: 50
    default-limit: 10
  reply:
    timeout-seconds: 30
